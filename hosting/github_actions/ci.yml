# GitHub Actions workflow for VisionQA.
#
# What this does: every time you push code or open a pull request, GitHub spins up a
# fresh Linux machine, installs Python and a small set of dependencies, and runs your
# test suite. If the tests pass you get a green checkmark; if they fail, a red X and a
# log to read. It's free on public repos.
#
# The nice part for THIS project -- and it's rare for an "AI project": the tests run
# OFFLINE, including the ones that exercise the "--real" vision-model code path.
# conftest.py installs a fake `litellm` module into sys.modules for
# those specific tests, so pytest never makes a network call and never needs a real
# `litellm` install. That means this workflow can install just Pillow, numpy, and
# pytest -- skipping `streamlit` (only needed for the web app, which no test imports)
# and `litellm` (only needed for a real `--real` call, which the fake fixture replaces
# in tests) -- and still turn all 35 tests green. No API key, no secrets, nothing to leak.
#
# WHERE THIS FILE GOES: copy it to ".github/workflows/ci.yml" at the ROOT of your repo.
# The real code sits at the repo root too. GitHub only runs workflow files that live
# under .github/workflows/.

# The name shown in the repo's "Actions" tab.
name: CI

# "on" decides WHEN this runs. Here: on every push, and on every pull request.
on:
  push:
  pull_request:

# A workflow is made of one or more "jobs". We have one job, called "test".
jobs:
  test:
    # The kind of machine to run on. ubuntu-latest is a standard, free Linux box.
    # Your tests are pure Python (numpy/Pillow), so they pass on Linux even though you
    # develop on Windows.
    runs-on: ubuntu-latest

    # "steps" run top to bottom on that machine.
    steps:
      # Step 1: download your repo's code onto the runner. Without this, the machine
      # is empty and has nothing to test. "uses" pulls in a prebuilt, official action.
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: install Python. Pin a version so CI matches what you develop against.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Cache pip downloads between runs so installs are faster.
          cache: pip

      # Step 3: install just what the test suite actually needs. requirements.txt
      # lives at the repo root and also lists streamlit (for app.py) and a
      # commented-out litellm (for --real) -- neither is exercised by pytest itself, so
      # we install the two real runtime deps plus pytest directly, keeping CI fast.
      # If you later add a test that imports streamlit or a real litellm call, switch
      # this line to `pip install -r requirements.txt` instead.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0" "numpy>=1.26" "pytest>=8.0"

      # Step 4: run the tests. We run from the repo root, because that's where
      # pyproject.toml, conftest.py, and the
      # tests/ folder are. conftest.py adds the repo root to sys.path itself, so
      # `import visionqa` works with no install step, and pyproject.toml's
      # `testpaths = ["tests"]` tells pytest where to look. A bare "pytest" from that
      # folder finds and runs the whole suite -- all 35 tests, offline, no API key.
      - name: Run tests
        run: pytest
